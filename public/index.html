<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101823">
  <title>亮亮专属欧金金</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#" data-page="home" aria-label="亮亮专属欧金金首页">
        <span class="brand-mark" data-site-mark>亮</span>
        <span class="brand-copy"><strong data-site-title>亮亮专属欧金金</strong><small>CODE · THINK · GROW</small></span>
      </a>
      <div class="side-label">工作台</div>
      <nav class="side-nav" aria-label="主导航">
        <button class="nav-link active" data-page="home"><span class="nav-icon">⌂</span>首页</button>
        <button class="nav-link" data-page="problems"><span class="nav-icon">▤</span>题库 <span class="nav-count" id="problem-count">04</span></button>
        <button class="nav-link" data-page="training"><span class="nav-icon">◷</span>训练</button>
        <button class="nav-link" data-page="contests"><span class="nav-icon">⚑</span>比赛</button>
        <button class="nav-link" data-page="submissions"><span class="nav-icon">⌁</span>提交记录</button>
      </nav>
      <div class="side-label side-label-spaced">社区</div>
      <nav class="side-nav" aria-label="社区导航">
        <button class="nav-link" data-page="discuss"><span class="nav-icon">▧</span>讨论</button>
        <button class="nav-link" data-page="ranking"><span class="nav-icon">↗</span>排行榜</button>
        <button class="nav-link admin-nav" data-page="admin" hidden><span class="nav-icon">⚙</span>管理后台</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="streak-card">
          <span class="streak-icon">✦</span>
          <div><strong>每天进步一点</strong><p>今天也来解一道题吧</p></div>
          <span class="streak-arrow">↗</span>
        </div>
        <div class="profile"><div class="avatar" id="profile-avatar">访</div><div class="profile-info"><strong id="profile-name">游客</strong><span id="profile-role">请登录后提交</span></div><button class="profile-action" id="profile-action" data-auth="login">登录</button></div>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <button class="mobile-menu" id="mobile-menu" aria-label="打开菜单">☰</button>
        <div class="breadcrumbs"><span>工作台</span><span class="crumb-sep">/</span><strong id="breadcrumb-current">首页</strong></div>
        <div class="topbar-actions">
          <div class="judge-status"><i id="judge-dot"></i><span id="judge-status-text">正在连接评测服务</span></div>
          <button class="top-auth-action" id="desktop-update-button" type="button" hidden>检查更新</button>
          <button class="top-auth-action" id="top-auth-action" data-auth="login">登录 / 注册</button>
          <button class="icon-button" aria-label="通知">♧<span class="notification-dot"></span></button>
          <div class="top-avatar" id="top-avatar">访</div>
        </div>
      </header>
      <div class="update-banner" id="update-banner" hidden>
        <span class="update-banner-icon" id="update-banner-icon">⇩</span>
        <div class="update-banner-text"><strong id="update-banner-title">软件更新</strong><span id="update-banner-message"></span></div>
        <div class="update-banner-track" id="update-banner-track" hidden><i id="update-banner-fill"></i></div>
        <div class="update-banner-actions" id="update-banner-actions"></div>
      </div>
      <section id="page-content" class="page-content" aria-live="polite"></section>
      <footer class="footer"><span data-site-title>亮亮专属欧金金</span><span>保持好奇，持续解题。</span><span>本地练习空间 · <span id="app-version">Web</span></span></footer>
    </main>
  </div>
  <div id="auth-modal" class="auth-backdrop" hidden></div>
  <div class="toast" id="toast" role="status"></div>
</body>
</html>
